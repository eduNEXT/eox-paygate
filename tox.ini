[tox]
envlist = py311-teak, py312-verawood, quality

[pycodestyle]
exclude = .git,.tox,.zeitlabs
max-line-length = 120

[pydocstyle]
match = .*\.py
match-dir = (?!\.zeitlabs)[^\.].*

[isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true
known_zeitlabs = zeitlabs_payments
known_first_party = eox_paygate
sections = FUTURE,STDLIB,THIRDPARTY,ZEITLABS,FIRSTPARTY,LOCALFOLDER
skip = .zeitlabs

[pytest]
DJANGO_SETTINGS_MODULE = test_settings
addopts = --cov eox_paygate --cov-report term-missing --cov-report xml
norecursedirs = .* docs requirements site-packages

[testenv]
usedevelop = true
allowlist_externals =
    make
deps =
    teak: -c{toxinidir}/requirements/constraints-teak.in
    verawood: -c{toxinidir}/requirements/constraints-verawood.in
    -r{toxinidir}/requirements/test.in
commands_pre =
    make install-zeitlabs
commands =
    make test-python

[testenv:quality]
deps =
    -c{toxinidir}/requirements/constraints-verawood.in
    -r{toxinidir}/requirements/test.in
    -r{toxinidir}/requirements/quality.in
commands =
    make quality
