name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run_tests:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.11'
            toxenv: py311-teak
          - python-version: '3.12'
            toxenv: py312-verawood
          - python-version: '3.12'
            toxenv: quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: pip install tox
      - name: Run tox
        run: tox -e ${{ matrix.toxenv }}
